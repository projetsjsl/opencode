name: Diagnose file search

on:
  push:
    branches:
      - search-diagnostic

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  file-search:
    if: github.repository == 'projetsjsl/opencode' && github.event_name == 'push' && github.ref == 'refs/heads/search-diagnostic'
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: packages/opencode
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
      - name: Compare native search on the stable base and reviewed head
        timeout-minutes: 5
        env:
          OPENCODE_SEARCH_REPORT_DIR: ${{ runner.temp }}/opencode-search-${{ github.run_id }}-${{ github.run_attempt }}
        run: python script/diagnose_file_search.py
      - name: Preserve diagnostic results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-file-search-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/opencode-search-${{ github.run_id }}-${{ github.run_attempt }}/report.json
            ${{ runner.temp }}/opencode-search-${{ github.run_id }}-${{ github.run_attempt }}/*.log
